[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvs-valuebench"
version = "0.1.0"
description = "Controlled comparison of value-alignment methods on KVS and AITA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0,<4",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "openai>=1.55,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13,<14",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
  "sentence-transformers>=3.1,<4",
  "statsmodels>=0.14,<1",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.scripts]
valuebench = "valuebench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
