paths:
  project_root: ../..
  kvs: dataset/kvs_data_new.json
  aita: dataset/aita_dataset_reduced.json
  output_root: alignment_benchmark/artifacts/paper
  official_hypo: alignment_benchmark/vendor/2026_ICLR_HyPO

teacher:
  model: openai/gpt-5.6-sol
  reasoning_effort: max
  max_tokens: 4000
  concurrency: 4
  max_attempts: 4
  min_confidence: 4
  prompt_version: kvs-canonical-v1
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  min_semantic_similarity: 0.52

model:
  id: Qwen/Qwen2.5-7B-Instruct
  load_in_4bit: true
  max_length: 512
  max_prompt_length: 320
  trust_remote_code: false
  system_prompt: You are a careful assistant. Follow the requested output format exactly.

training:
  seeds: [13, 42, 97]
  target_rating: 1
  epochs: 3
  train_batch_size: 1
  eval_batch_size: 2
  gradient_accumulation_steps: 16
  warmup_ratio: 0.10
  weight_decay: 0.0
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  gradient_checkpointing: true
  optimizer: paged_adamw_8bit
  sft_learning_rate: 0.0001
  preference_learning_rate: 0.000005
  dpo_beta: 0.1
  ipo_beta: 0.1
  simpo_beta: 2.0
  simpo_gamma: 1.0
  orpo_beta: 0.1
  early_stopping_patience: 2
  save_total_limit: 1

evaluation:
  batch_size: 4
  kvs_prompt_variants: 3
  aita_max_per_fine_value: 500
  aita_labels: [NTA, NEUTRAL, YTA]
  bootstrap_samples: 10000
  confidence_level: 0.95
  min_aita_main_table_n: 30
  steering_sites: [block, attn]
  steering_layers: [0.25, 0.5, 0.75]
  steering_coefficients: [0.5, 1.0, 1.5, 2.0, 3.0]
  steering_drift_penalty: 1.0

experiment:
  values:
    - Self_direction
    - Stimulation
    - Hedonism
    - Achievement
    - Power
    - Security
    - Conformity
    - Tradition
    - Benevolence
    - Universalism
  trainable_methods: [sft, dpo, hypo, ipo, simpo, orpo]
  steering_methods: [steering_block, steering_attn]
  train_method_controls: true
